<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Sylesh through an accessible contact form.">

    <meta name="author"
          content="Sylesh">

    <title>Contact | Sylesh Portfolio</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>


<body>

    <a href="#main-content"
       class="skip-link">
        Skip to main content
    </a>


    <!-- Header -->
    <header class="site-header">

        <div class="container header-container">

            <a href="index.html"
               class="logo"
               aria-label="Go to Sylesh home page">
                Sylesh<span>.</span>
            </a>


            <nav aria-label="Main navigation">

                <ul class="nav-list">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="about.html">
                            About
                        </a>
                    </li>

                    <li>
                        <a href="projects.html">
                            Projects
                        </a>
                    </li>

                    <li>
                        <a href="contact.html"
                           aria-current="page">
                            Contact
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- Main -->
    <main id="main-content">

        <section class="page-heading">

            <div class="container">

                <p class="eyebrow">
                    Get In Touch
                </p>

                <h1>
                    Contact Me
                </h1>

                <p>
                    Fill in the form below to send a message.
                </p>

            </div>

        </section>


        <section class="section">

            <div class="container">

                <div class="form-container">

                    <h2>
                        Contact Form
                    </h2>

                    <p id="form-help">
                        Fields marked with
                        <span aria-hidden="true">*</span>
                        are required.
                    </p>


                    <form action="#"
                          method="post"
                          aria-describedby="form-help">


                        <!-- Name -->
                        <div class="form-group">

                            <label for="name">
                                Full Name
                                <span aria-hidden="true">*</span>
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                autocomplete="name"
                                required
                                aria-required="true">

                        </div>


                        <!-- Email -->
                        <div class="form-group">

                            <label for="email">
                                Email Address
                                <span aria-hidden="true">*</span>
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                autocomplete="email"
                                required
                                aria-required="true">

                        </div>


                        <!-- Subject -->
                        <div class="form-group">

                            <label for="subject">
                                Subject
                                <span aria-hidden="true">*</span>
                            </label>

                            <input
                                type="text"
                                id="subject"
                                name="subject"
                                required
                                aria-required="true">

                        </div>


                        <!-- Message -->
                        <div class="form-group">

                            <label for="message">
                                Message
                                <span aria-hidden="true">*</span>
                            </label>

                            <textarea
                                id="message"
                                name="message"
                                rows="7"
                                required
                                aria-required="true"></textarea>

                        </div>


                        <button type="submit"
                                class="button">
                            Send Message
                        </button>


                    </form>

                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="site-footer">

        <div class="container">

            <p>
                &copy; 2026 Sylesh. All Rights Reserved.
            </p>

        </div>

    </footer>

</body>

</html>
